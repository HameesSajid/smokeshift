[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smokeshift"
version = "0.1.0"
description = "Benchmarking forecasting paradigms under wildfire-smoke distribution shift, on US EPA PM2.5 data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "xgboost>=2.1",
]

[project.optional-dependencies]
neural = ["torch>=2.2"]
foundation = ["torch>=2.2", "chronos-forecasting>=1.4", "timesfm>=1.2"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::RuntimeWarning"]
